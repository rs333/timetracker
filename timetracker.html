<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Time Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        #timer { font-size: 2em; margin-bottom: 1em; }
        #toggleBtn { font-size: 1.2em; padding: 0.5em 1.5em; }
        #periods { margin-top: 2em; }
        table { border-collapse: collapse; width: 100%; }
        th, td {
            border: none;
            outline: none;
            padding-top: 0;
            padding-bottom: 0;
            margin-top: 0;
            margin-bottom: 0;
            text-align: left;
        }
        th { background: #f0f0f0; }
        #periodsBody tr:nth-child(even) { background: #f7f7f7; }
        #periodsBody tr:nth-child(odd) { background: #ffffff; }
        input[type="datetime-local"].endtime-input,
        input[type="datetime-local"].starttime-input {
            border: none;
            outline: none;
            background: transparent;
            width: 220px;
            min-width: 180px;
            max-width: 100%;
            box-sizing: border-box;
        }
        .comment-input {
            width: 90%;
            border: 1px solid #d3d3d3;
            border-radius: 3px;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 1.1em;
            padding: 2px 6px;
        }
        .delete-btn:hover { color: #e74c3c; }
        .toast {
            position: fixed;
            bottom: 2em;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 0.7em 1.5em;
            border-radius: 5px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        .toast.visible { opacity: 1; }
    </style>
</head>
<body>
    <h1>Task Time Tracker</h1>
    <div id="timer">00:00:00</div>
    <button id="toggleBtn">Start</button>

    <div id="summary">
        <h2>Summary</h2>
        <label for="summaryRange">Show data for last
            <select id="summaryRange">
                <option value="7d">7 days</option>
                <option value="30d">30 days</option>
                <option value="4w" selected>4 weeks</option>
                <option value="8w">8 weeks</option>
                <option value="12w">12 weeks</option>
                <option value="24w">24 weeks</option>
                <option value="52w">52 weeks</option>
                <option value="3m">3 months</option>
                <option value="6m">6 months</option>
                <option value="12m">12 months</option>
            </select>
        </label>
        <button id="refreshGraphBtn" style="margin-left:1em;">Refresh</button>
        <canvas id="summaryChart" width="600" height="300"></canvas>
    </div>

    <div id="periods">
        <h2>Work Periods</h2>
        <table>
            <thead>
                <tr>
                    <th>Start / End Time</th>
                    <th>Duration</th>
                    <th>Comment</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="periodsBody">
            </tbody>
        </table>
    </div>
    <div style="margin-top:2em;">
        <button id="exportBtn">Export Data</button>
        <button id="importBtn">Import Data</button>
        <input type="file" id="importFileInput" style="display:none" accept="application/json" />
    </div>
    <div id="toast" class="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const TIMER_INTERVAL_MS = 500;
        const STATE_SAVE_INTERVAL_MS = 5000;
        const GRAPH_UPDATE_INTERVAL_MS = 60000;

        let timerInterval = null;
        let startTime = null;
        let periods = [];
        let barChart = null;
        let graphUpdateInterval = null;
        let stateSaveInterval = null;
        let lastGraphUpdate = 0;
        let inProgressComment = '';

        function showToast(msg, durationMs = 3000) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('visible');
            setTimeout(() => el.classList.remove('visible'), durationMs);
        }

        function toLocalDatetimeString(date) {
            const d = date instanceof Date ? date : new Date(date);
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function escapeAttr(str) {
            return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function saveTimerState() {
            if (startTime) {
                localStorage.setItem('timerInProgress', JSON.stringify({ startTime }));
            } else {
                localStorage.removeItem('timerInProgress');
            }
        }

        function loadTimerState() {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            if (stateSaveInterval) { clearInterval(stateSaveInterval); stateSaveInterval = null; }
            removeInProgressRow();
            startTime = null;
            document.getElementById('toggleBtn').textContent = 'Start';
            document.getElementById('toggleBtn').style.background = '';
            document.getElementById('timer').textContent = '00:00:00';

            const data = localStorage.getItem('timerInProgress');
            if (data) {
                try {
                    const obj = JSON.parse(data);
                    if (obj && obj.startTime) {
                        startTime = obj.startTime;
                        inProgressComment = localStorage.getItem('inProgressComment') || '';
                        timerInterval = setInterval(updateTimerDisplay, TIMER_INTERVAL_MS);
                        stateSaveInterval = setInterval(saveTimerState, STATE_SAVE_INTERVAL_MS);
                        document.getElementById('toggleBtn').textContent = 'Stop';
                        document.getElementById('toggleBtn').style.background = '#e74c3c';
                        addInProgressRow();
                        setGraphUpdateInterval();
                    }
                } catch (e) {}
            }
        }

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
            const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
            const seconds = String(totalSeconds % 60).padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
        }

        function updateTimerDisplay() {
            if (!startTime) return;
            const now = Date.now();
            const display = now - startTime;
            document.getElementById('timer').textContent = formatTime(display);
            const inProgressDurationCell = document.querySelector('#inProgressRow > td:nth-child(2)');
            if (inProgressDurationCell) {
                inProgressDurationCell.textContent = formatTime(display);
            }
        }

        function renderTable() {
            const tbody = document.getElementById('periodsBody');
            tbody.innerHTML = '';
            if (timerInterval && startTime) {
                addInProgressRow();
            }
            for (let i = periods.length - 1; i >= 0; i--) {
                addCompletedPeriodRow(periods[i], i);
            }
        }

        function addInProgressRow() {
            const tbody = document.getElementById('periodsBody');
            if (document.getElementById('inProgressRow')) return;
            const tr = document.createElement('tr');
            tr.id = 'inProgressRow';
            const localStart = toLocalDatetimeString(startTime);
            tr.innerHTML = `
                <td style="vertical-align:top;">
                    <input class="starttime-input" type="datetime-local" value="${localStart}" disabled style="width:220px; min-width:180px; max-width:100%; display:block; margin-bottom:2px; opacity:0.7; box-sizing:border-box;" />
                    <div><em>In progress</em></div>
                </td>
                <td style="vertical-align:middle;"></td>
                <td style="vertical-align:middle;">
                    <input class="comment-input" type="text" id="inProgressComment" value="${escapeAttr(inProgressComment)}" autocomplete="off" />
                </td>
                <td></td>
            `;
            tbody.insertBefore(tr, tbody.firstChild);
        }

        function removeInProgressRow() {
            const row = document.getElementById('inProgressRow');
            if (row) row.remove();
        }

        function addCompletedPeriodRow(p, index) {
            const tbody = document.getElementById('periodsBody');
            const tr = document.createElement('tr');
            const localStart = toLocalDatetimeString(p.start);
            const localEnd = toLocalDatetimeString(p.end);
            tr.innerHTML = `
                <td style="vertical-align:top;">
                    <input class="starttime-input" type="datetime-local" value="${localStart}" data-index="${index}" style="width:220px; min-width:180px; max-width:100%; display:block; margin-bottom:2px; box-sizing:border-box;" />
                    <input class="endtime-input" type="datetime-local" value="${localEnd}" data-index="${index}" style="width:220px; min-width:180px; max-width:100%; display:block; margin-top:2px; box-sizing:border-box;" />
                </td>
                <td style="vertical-align:middle;">${formatTime(p.end - p.start)}</td>
                <td style="vertical-align:middle;">
                    <input class="comment-input" type="text" value="${escapeAttr(p.comment || '')}" data-index="${index}" autocomplete="off" />
                </td>
                <td style="vertical-align:middle;">
                    <button class="delete-btn" data-index="${index}" title="Delete">&times;</button>
                </td>
            `;
            tbody.appendChild(tr);
        }

        function savePeriods() {
            localStorage.setItem('workPeriods', JSON.stringify(periods));
        }

        function loadPeriods() {
            const data = localStorage.getItem('workPeriods');
            if (data) {
                try {
                    periods = JSON.parse(data);
                } catch(e) {
                    periods = [];
                }
            }
        }

        function startTimer() {
            startTime = Date.now();
            inProgressComment = '';
            localStorage.removeItem('inProgressComment');
            timerInterval = setInterval(updateTimerDisplay, TIMER_INTERVAL_MS);
            stateSaveInterval = setInterval(saveTimerState, STATE_SAVE_INTERVAL_MS);
            document.getElementById('toggleBtn').textContent = 'Stop';
            document.getElementById('toggleBtn').style.background = '#e74c3c';
            addInProgressRow();
            setGraphUpdateInterval();
            saveTimerState();
        }

        function stopTimer() {
            clearInterval(timerInterval);
            clearInterval(stateSaveInterval);
            timerInterval = null;
            stateSaveInterval = null;

            const endTime = Date.now();
            periods.push({ start: startTime, end: endTime, comment: inProgressComment });

            localStorage.removeItem('timerInProgress');
            localStorage.removeItem('inProgressComment');
            savePeriods();

            startTime = null;
            inProgressComment = '';
            document.getElementById('timer').textContent = '00:00:00';
            document.getElementById('toggleBtn').textContent = 'Start';
            document.getElementById('toggleBtn').style.background = '';
            if (graphUpdateInterval) clearInterval(graphUpdateInterval);
            renderTable();
            renderSummaryChart(true);
        }

        document.getElementById('toggleBtn').addEventListener('click', () => {
            if (timerInterval) {
                stopTimer();
            } else {
                startTimer();
            }
        });

        function getDayStart(date) {
            const d = new Date(date);
            d.setHours(0,0,0,0);
            return d;
        }

        function getWeekStart(date) {
            const d = new Date(date);
            d.setHours(0,0,0,0);
            const day = d.getDay();
            d.setDate(d.getDate() - day);
            return d;
        }

        function getMonthStart(date) {
            const d = new Date(date);
            d.setDate(1);
            d.setHours(0,0,0,0);
            return d;
        }

        function getSummaryData(periods, range) {
            const unit = range.slice(-1);
            const count = parseInt(range.slice(0, -1), 10);
            const now = new Date();
            const labels = [];
            const dataMap = {};

            let periodMs, getPeriodStart, advancePeriod;
            if (unit === 'w') {
                periodMs = 7 * 24 * 60 * 60 * 1000;
                getPeriodStart = getWeekStart;
                advancePeriod = d => new Date(d.getTime() - periodMs);
            } else if (unit === 'm') {
                getPeriodStart = getMonthStart;
                advancePeriod = d => {
                    const prev = new Date(d);
                    prev.setMonth(prev.getMonth() - 1);
                    return getMonthStart(prev);
                };
            } else {
                periodMs = 24 * 60 * 60 * 1000;
                getPeriodStart = getDayStart;
                advancePeriod = d => new Date(d.getTime() - periodMs);
            }

            let currentPeriodStart = getPeriodStart(now);
            for (let i = 0; i < count; i++) {
                let key;
                if (unit === 'm') {
                    key = `${currentPeriodStart.getFullYear()}-${String(currentPeriodStart.getMonth() + 1).padStart(2, '0')}`;
                } else {
                    key = toLocalDatetimeString(currentPeriodStart).slice(0,10);
                }
                labels.unshift(key);
                dataMap[key] = 0;
                currentPeriodStart = advancePeriod(currentPeriodStart);
            }

            periods.forEach(p => {
                if (!p.start || !p.end) return;
                const start = new Date(p.start);
                let periodKey;
                if (unit === 'm') {
                    const ms = getMonthStart(start);
                    periodKey = `${ms.getFullYear()}-${String(ms.getMonth() + 1).padStart(2, '0')}`;
                } else {
                    periodKey = toLocalDatetimeString(getPeriodStart(start)).slice(0,10);
                }
                if (periodKey in dataMap) {
                    dataMap[periodKey] += (p.end - p.start) / (1000 * 60 * 60);
                }
            });

            if (startTime) {
                const nowTs = Date.now();
                let periodKey;
                if (unit === 'm') {
                    const ms = getMonthStart(new Date(startTime));
                    periodKey = `${ms.getFullYear()}-${String(ms.getMonth() + 1).padStart(2, '0')}`;
                } else {
                    periodKey = toLocalDatetimeString(getPeriodStart(new Date(startTime))).slice(0,10);
                }
                if (periodKey in dataMap) {
                    dataMap[periodKey] += (nowTs - startTime) / (1000 * 60 * 60);
                }
            }

            return labels.map(label => ({ label, hours: dataMap[label] }));
        }

        function renderSummaryChart(force = false) {
            if (typeof Chart === 'undefined') return;
            const now = Date.now();
            if (!force && timerInterval && now - lastGraphUpdate < GRAPH_UPDATE_INTERVAL_MS) return;
            lastGraphUpdate = now;

            const range = document.getElementById('summaryRange').value;
            const summary = getSummaryData(periods, range);
            const labels = summary.map(s => s.label);
            const data = summary.map(s => s.hours.toFixed(2));
            let xLabel;
            if (range.slice(-1) === 'w') xLabel = 'Week Starting';
            else if (range.slice(-1) === 'm') xLabel = 'Month';
            else xLabel = 'Date';

            if (barChart) {
                barChart.data.labels = labels;
                barChart.data.datasets[0].data = data;
                barChart.options.scales.x.title.text = xLabel;
                barChart.update();
            } else {
                const ctx = document.getElementById('summaryChart').getContext('2d');
                barChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Hours Worked',
                            data: data,
                            backgroundColor: '#3498db',
                        }]
                    },
                    options: {
                        scales: {
                            y: { beginAtZero: true, title: { display: true, text: 'Hours' } },
                            x: { title: { display: true, text: xLabel } }
                        }
                    }
                });
            }
        }

        document.getElementById('summaryRange').addEventListener('change', () => renderSummaryChart(true));
        document.getElementById('refreshGraphBtn').addEventListener('click', () => renderSummaryChart(true));

        function setGraphUpdateInterval() {
            if (graphUpdateInterval) clearInterval(graphUpdateInterval);
            if (timerInterval) {
                graphUpdateInterval = setInterval(() => renderSummaryChart(), GRAPH_UPDATE_INTERVAL_MS);
            }
        }

        function exportData() {
            const data = {
                workPeriods: periods,
                timerInProgress: localStorage.getItem('timerInProgress'),
                inProgressComment: localStorage.getItem('inProgressComment')
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'timetracker-data.json';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 0);
        }

        function importDataFromFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!Array.isArray(data.workPeriods)) {
                        showToast('Invalid data: missing workPeriods array');
                        return;
                    }
                    if (!confirm('This will replace all existing data. Continue?')) return;
                    periods = data.workPeriods;
                    localStorage.setItem('workPeriods', JSON.stringify(periods));
                    if (data.timerInProgress) {
                        localStorage.setItem('timerInProgress', data.timerInProgress);
                    } else {
                        localStorage.removeItem('timerInProgress');
                    }
                    if (typeof data.inProgressComment === 'string') {
                        localStorage.setItem('inProgressComment', data.inProgressComment);
                    } else {
                        localStorage.removeItem('inProgressComment');
                    }
                    loadPeriods();
                    loadTimerState();
                    renderTable();
                    renderSummaryChart(true);
                    showToast('Data imported successfully.');
                } catch (err) {
                    showToast('Failed to import data: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        document.getElementById('exportBtn').addEventListener('click', exportData);
        document.getElementById('importBtn').addEventListener('click', function() {
            document.getElementById('importFileInput').value = '';
            document.getElementById('importFileInput').click();
        });
        document.getElementById('importFileInput').addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                importDataFromFile(e.target.files[0]);
            }
        });

        // Unified event delegation for the periods table
        document.getElementById('periodsBody').addEventListener('input', (e) => {
            if (e.target.classList.contains('comment-input')) {
                if (e.target.id === 'inProgressComment') {
                    inProgressComment = e.target.value;
                    localStorage.setItem('inProgressComment', inProgressComment);
                } else {
                    const idx = e.target.getAttribute('data-index');
                    if (idx !== null) periods[idx].comment = e.target.value;
                }
            }
        });

        document.getElementById('periodsBody').addEventListener('change', (e) => {
            if (e.target.classList.contains('comment-input')) {
                const idx = e.target.getAttribute('data-index');
                if (idx !== null) savePeriods();
            } else if (e.target.classList.contains('endtime-input')) {
                const idx = e.target.getAttribute('data-index');
                if (idx !== null && periods[idx]) {
                    const newEnd = new Date(e.target.value);
                    if (!isNaN(newEnd.getTime())) {
                        if (newEnd.getTime() > periods[idx].start) {
                            periods[idx].end = newEnd.getTime();
                            savePeriods();
                            renderTable();
                            renderSummaryChart(true);
                        } else {
                            showToast('End time must be after start time.');
                            e.target.value = toLocalDatetimeString(periods[idx].end);
                        }
                    }
                }
            } else if (e.target.classList.contains('starttime-input')) {
                const idx = e.target.getAttribute('data-index');
                if (idx !== null && periods[idx]) {
                    const newStart = new Date(e.target.value);
                    if (!isNaN(newStart.getTime())) {
                        if (newStart.getTime() < periods[idx].end) {
                            periods[idx].start = newStart.getTime();
                            savePeriods();
                            renderTable();
                            renderSummaryChart(true);
                        } else {
                            showToast('Start time must be before end time.');
                            e.target.value = toLocalDatetimeString(periods[idx].start);
                        }
                    }
                }
            }
        });

        // Delete button handler
        document.getElementById('periodsBody').addEventListener('click', (e) => {
            if (e.target.classList.contains('delete-btn')) {
                const idx = parseInt(e.target.getAttribute('data-index'), 10);
                if (!isNaN(idx) && periods[idx]) {
                    if (!confirm('Delete this work period?')) return;
                    periods.splice(idx, 1);
                    savePeriods();
                    renderTable();
                    renderSummaryChart(true);
                }
            }
        });

        // Initialize
        loadPeriods();
        renderTable();
        loadTimerState();
        updateTimerDisplay();
        window.addEventListener('DOMContentLoaded', () => renderSummaryChart(true));

        // Synchronize across tabs
        window.addEventListener('storage', function(e) {
            if (e.key === 'workPeriods' || e.key === 'timerInProgress' || e.key === 'inProgressComment') {
                if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
                if (stateSaveInterval) { clearInterval(stateSaveInterval); stateSaveInterval = null; }
                removeInProgressRow();
                loadPeriods();
                loadTimerState();
                renderTable();
                updateTimerDisplay();
                renderSummaryChart(true);
            }
        });
    </script>
</body>
</html>
